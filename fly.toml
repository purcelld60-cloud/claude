# Configuração do Fly.io para o servidor online (veja docs/SERVIDOR-ONLINE.md).
# Troque o nome do app por um seu antes do primeiro deploy.
app = "daroca-online-TROQUE-ESTE-NOME"
primary_region = "gru"

[build]
  dockerfile = "server/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
