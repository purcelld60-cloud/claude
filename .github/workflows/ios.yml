name: Gerar IPA (iOS, sem assinatura)

# Gera um .ipa SEM assinatura e publica em Releases. Para instalar no iPhone é preciso
# um instalador que assine ou dispense assinatura (TrollStore, AltStore, SideStore,
# Sideloadly, ESign...). Não usa senhas nem certificados.
# Os Macs do GitHub às vezes ficam sem vaga ("not acquired by Runner"): por isso o build
# tenta em três tipos de Mac ao mesmo tempo. O primeiro que terminar publica a Release;
# os outros só substituem os mesmos arquivos.
on:
  workflow_dispatch:
    inputs:
      tentativa:
        description: 'Número da tentativa (o workflow tenta de novo sozinho até 4 vezes se faltar Mac)'
        required: false
        default: '1'
      dev:
        description: 'IPA de DESENVOLVEDOR: tudo liberado (Campanha 2 e capítulos, Terreiro dos Chefes e todas as cutscenes)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths: ['dist/**', 'native/ios/**', '.github/workflows/ios.yml', '.github/scripts/**']

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    strategy:
      fail-fast: false
      matrix:
        mac: [macos-15, macos-14, macos-15-intel]
    runs-on: ${{ matrix.mac }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Lista de músicas (dist/musicas)
        run: python3 .github/scripts/musicas.py

      - name: Ligar o modo desenvolvedor (só no IPA dev)
        if: ${{ github.event.inputs.dev == 'true' }}
        run: |
          sed -i '' 's/window.DAROCA_DEV = false;/window.DAROCA_DEV = true;/' dist/dev-mode.js
          grep -n "DAROCA_DEV = true" dist/dev-mode.js

      - name: Preparar ícone e projeto
        working-directory: native/ios
        run: |
          sips -s format png -z 1024 1024 ../../dist/assets/app-icon-512.png --out App/Assets.xcassets/AppIcon.appiconset/icon.png
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Compilar sem assinatura
        working-directory: native/ios
        run: |
          VERSAO=$(python3 -c "import json;print(json.load(open('../../dist/app-version.json'))['versionName'])")
          xcodebuild -project DaRoca.xcodeproj -scheme DaRoca -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSAO" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Empacotar o IPA
        working-directory: native/ios
        run: |
          DATA=$(date -u +%Y%m%d)
          SUF=""; if [ "${{ github.event.inputs.dev }}" = "true" ]; then SUF="-DEV"; fi
          NOME="DaRoca${SUF}-${VERSAO}-${DATA}-b${{ github.run_number }}.ipa"
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DaRoca.app Payload/
          test -f Payload/DaRoca.app/dist/index.html
          zip -qry "$NOME" Payload
          cp "$NOME" DaRoca.ipa
          ls -la *.ipa
          echo "NOME=$NOME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: DaRoca-ipa-${{ matrix.mac }}
          path: native/ios/${{ env.NOME }}

      - name: Publicar em Releases
        working-directory: native/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-b${{ github.run_number }}"; TIT="Da Roça iOS ${VERSAO} (build ${{ github.run_number }})"; NOTA="IPA sem assinatura. Instale com o seu instalador de IPA (TrollStore, AltStore, SideStore, Sideloadly, ESign...)."
          if [ "${{ github.event.inputs.dev }}" = "true" ]; then TAG="ios-dev-b${{ github.run_number }}"; TIT="Da Roça iOS ${VERSAO} · DESENVOLVEDOR (build ${{ github.run_number }})"; NOTA="IPA de DESENVOLVEDOR: tudo liberado (Campanha 2 com escolha de capítulo, Terreiro dos Chefes e o botão 🎬 CUTSCENES com todas as cenas). $NOTA"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --target "${{ github.sha }}" --prerelease=${{ github.event.inputs.dev == 'true' }} \
            --title "$TIT" \
            --notes "$NOTA" || true
          gh release upload "$TAG" "$NOME" DaRoca.ipa --clobber

  # Se nenhum Mac pegou o trabalho (o GitHub cancela depois de ~15 minutos na fila),
  # dispara o workflow de novo sozinho, até 4 tentativas no total.
  nova-tentativa:
    needs: ipa
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Tentar de novo se o IPA não saiu
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TENTATIVA: ${{ github.event.inputs.tentativa || '1' }}
        run: |
          if gh release view "ios-b${{ github.run_number }}" >/dev/null 2>&1 || gh release view "ios-dev-b${{ github.run_number }}" >/dev/null 2>&1; then echo "IPA publicado."; exit 0; fi
          if [ "$TENTATIVA" -ge 4 ]; then echo "::warning title=IPA::Sem Mac livre depois de 4 tentativas. Rode o workflow de novo mais tarde."; exit 0; fi
          echo "Nenhum Mac livre: tentativa $((TENTATIVA + 1)) de 4."
          gh workflow run ios.yml --ref main -f tentativa=$((TENTATIVA + 1)) -f dev=${{ github.event.inputs.dev || 'false' }}
