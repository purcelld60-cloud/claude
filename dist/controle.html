<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<title>Controle · Da Roça</title>
<link rel="stylesheet" href="controle.css">
</head>
<body>
<main id="app">
  <section id="entrar" class="tela">
    <h1>DA ROÇA <small>controle</small></h1>
    <p>Digite o código que aparece na TV.</p>
    <form id="formEntrar" autocomplete="off">
      <input id="codigo" maxlength="6" placeholder="CÓDIGO" autocapitalize="characters" spellcheck="false" aria-label="Código da sala">
      <input id="nome" maxlength="16" placeholder="Seu nome" aria-label="Seu nome">
      <button type="submit">ENTRAR</button>
    </form>
    <p id="aviso" class="aviso" role="status"></p>
  </section>
  <section id="controle" class="tela" hidden>
    <header>
      <span id="eu" class="eu">P?</span>
      <span id="status" class="status">Conectando…</span>
      <button id="trocar" type="button" class="mini">PERSONAGEM</button>
    </header>
    <div class="pad-area">
      <div id="dpad" class="dpad" aria-label="Direcional" role="application">
        <span class="seta s-u">▲</span><span class="seta s-l">◀</span><span class="seta s-r">▶</span><span class="seta s-d">▼</span><i id="bola"></i>
      </div>
      <div class="botoes">
        <button id="btnB" class="btn b" type="button" aria-label="Botão B">B</button>
        <button id="btnA" class="btn a" type="button" aria-label="Botão A">A</button>
      </div>
    </div>
  </section>
  <section id="escolher" class="tela" hidden>
    <h2>ESCOLHA SEU PERSONAGEM</h2>
    <div id="lista" class="lista"></div>
    <button id="voltar" type="button">PRONTO</button>
  </section>
</main>
<script src="visual.js"></script>
<script src="art.js"></script>
<script src="controle.js"></script>
</body>
</html>
